<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Profiles</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .profiles {
            width: 850px;
            margin: 20px auto;
        }

        .profile {
            height: 180px;

            display: flex;
            align-items: center;

            margin-bottom: 0;
        }

        /* Image */

        .profile-image {
            width: 170px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-image img {
            width: 125px;
            height: 125px;

            border-radius: 50%;

            object-fit: cover;
        }


        /* Profile Information */

        .profile-info {
            width: 500px;
        }

        .name {
            font-size: 40px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .description {
            font-size: 38px;
            color: gray;

            margin-bottom: 8px;
        }

        .status {
            font-size: 36px;
            color: gray;
        }


        /* Follow Button */

        .button-container {
            width: 180px;

            display: flex;
            justify-content: center;
        }

        .follow-button {
            width: 175px;
            height: 85px;

            background-color: #4285e5;

            color: white;

            border: none;
            border-radius: 10px;

            font-size: 38px;

            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="profiles">

       

        <div class="profile">

            <div class="profile-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBPVM4PdUN_8Aw-qhBOAUlX99znlAOwHWc_q06y_TKVw&s=10" alt="Oliver">
            </div>

            <div class="profile-info">

                <div class="name">
                    cat
                </div>

                <div class="description">
                    the cat
                </div>

                <div class="status">
                    Popular
                </div>

            </div>

            <div class="button-container">
                <button class="follow-button">
                    Follow
                </button>
            </div>

        </div>



        <div class="profile">

            <div class="profile-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5yNnB3lRwQRzBLX2-pFQEv-KVBfpol1eCdtq8K9vWIA&s=10" alt="Mimi">
            </div>

            <div class="profile-info">

                <div class="name">
                    Cateshwar
                </div>

                <div class="description">
                    Zopesh 
                </div>

                <div class="status">
                    Popular
                </div>

            </div>

            <div class="button-container">
                <button class="follow-button">
                    Follow
                </button>
            </div>

        </div>


      

        <div class="profile">

            <div class="profile-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfPbLY29utaZC4Bh0CVrm-aPFmWX3M0F2ADb1HzcBW0g&s=10" alt="Rex">
            </div>

            <div class="profile-info">

                <div class="name">
                    Amhi Bull
                </div>

                <div class="description">
                    smiley
                </div>

                <div class="status">
                    Popular
                </div>

            </div>

            <div class="button-container">
                <button class="follow-button">
                    Follow
                </button>
            </div>

        </div>

    </div>

</body>
</html>
