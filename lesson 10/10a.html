<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .profile {
            width: 850px;
            height: 210px;

            display: flex;
            align-items: center;

            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

       
        .profile-image {
            width: 170px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-image img {
            width: 135px;
            height: 135px;

            border-radius: 50%;
            object-fit: cover;
        }

       
        .profile-info {
            flex: 1;
        }

        .name {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            font-size: 38px;
            color: gray;
            margin-bottom: 12px;
        }

        .status {
            font-size: 38px;
            color: gray;
        }

       
        .button-container {
            width: 220px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .follow-button {
            background-color: #4285e5;
            color: white;

            border: none;
            border-radius: 10px;

            width: 190px;
            height: 90px;

            font-size: 40px;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="profile">

     
        <div class="profile-image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBPVM4PdUN_8Aw-qhBOAUlX99znlAOwHWc_q06y_TKVw&s=10" alt="Profile Image">
        </div>

        
        <div class="profile-info">
            <div class="name">oliver</div>
            <div class="description">the cat</div>
            <div class="status">Popular</div>
        </div>

        
        <div class="button-container">
            <button class="follow-button">Follow</button>
        </div>

    </div>

</body>
</html>
